<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des médailles</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --line:#e3e6eb; --txt:#1f2933; --muted:#6b7684;
    --accent:#b4232c; --accent-soft:#fbeaea; --blue:#1f5fa8;
    --ok:#1e7d4f; --ok-bg:#e3f4ea; --warn:#9a6700; --warn-bg:#fff4d6;
    --ko:#b4232c; --ko-bg:#fbe4e4; --neutral-bg:#eef0f3;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:13px;color:var(--txt);background:var(--bg)}
  header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600}
  .stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .stat{padding:3px 9px;border-radius:12px;background:var(--neutral-bg);font-size:12px;cursor:pointer;border:1px solid transparent}
  .stat b{margin-left:4px}
  .stat.active{border-color:var(--txt)}
  .toolbar{display:flex;gap:8px;padding:8px 14px;flex-wrap:wrap;align-items:center}
  input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:5px;padding:5px 7px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid #c9d6ea;border-color:var(--blue)}
  #q{min-width:220px;flex:1}
  button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:5px;padding:5px 11px;cursor:pointer}
  button:hover{background:#f0f2f5}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(.93)}
  button.danger{color:var(--ko);border-color:#e9b9b9}
  button:disabled{opacity:.5;cursor:default}
  .wrap{padding:0 14px 14px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
  th{position:sticky;top:0;background:#fafbfc;font-weight:600;cursor:pointer;user-select:none;font-size:12px;color:var(--muted)}
  th .arr{font-size:10px;margin-left:3px}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#f7f9fc}
  tbody tr.sel{background:#eaf1fb}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;background:var(--neutral-bg)}
  .b-ok{background:var(--ok-bg);color:var(--ok)}
  .b-warn{background:var(--warn-bg);color:var(--warn)}
  .b-ko{background:var(--ko-bg);color:var(--ko)}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  /* Panneau de saisie */
  #overlay{position:fixed;inset:0;background:rgba(20,25,35,.35);display:none;z-index:10}
  #drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--panel);box-shadow:-4px 0 18px rgba(0,0,0,.15);display:none;flex-direction:column;z-index:11}
  #drawer.open,#overlay.open{display:flex}
  .dhead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .dhead h2{font-size:15px;margin:0;flex:1}
  .dirty{font-size:11px;color:var(--warn);display:none}
  .dirty.on{display:inline}
  .dbody{flex:1;overflow:auto;padding:6px 16px 16px}
  fieldset{border:none;margin:12px 0 0;padding:0}
  legend{font-weight:600;color:var(--accent);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;padding:0 0 6px;border-bottom:2px solid var(--accent-soft);width:100%}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;margin-top:9px}
  .f{display:flex;flex-direction:column;gap:3px}
  .f.full{grid-column:1/-1}
  .f label{font-size:11.5px;color:var(--muted)}
  .f input,.f select,.f textarea{width:100%}
  .f textarea{min-height:70px;resize:vertical}
  .f .ro{padding:5px 7px;background:#f4f5f7;border-radius:5px;min-height:28px}
  .chk{flex-direction:row;align-items:center;gap:7px;padding-top:16px}
  .chk input{width:auto}
  .dfoot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .dfoot .sp{flex:1}
  .confirm{display:none;gap:6px;align-items:center;color:var(--ko)}
  .confirm.on{display:flex}
  #toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);background:#1f2933;color:#fff;padding:7px 14px;border-radius:6px;font-size:12.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
  #toast.on{opacity:1}
  .refwrap{display:flex;gap:4px;align-items:flex-start}
  .refwrap select{flex:1;min-width:0}
  .addref{padding:4px 9px;font-weight:600;color:var(--blue)}
  .newref{display:none;gap:4px;margin-top:4px}
  .newref.on{display:flex}
  .newref input{flex:1;min-width:0}
  .newref button{padding:4px 9px}
  .flt{display:flex;flex-direction:column;gap:1px}
  .flt small{font-size:10.5px;color:var(--muted);padding-left:2px}
  .flt select{max-width:190px}
  .flt select.on{border-color:var(--blue);background:#eef4fc}
  /* Panneau de configuration des filtres */
  #cfg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(460px,94%);max-height:86vh;background:var(--panel);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:none;flex-direction:column;z-index:12}
  #cfg.open{display:flex}
  #cfg .dbody{padding:8px 16px}
  .cfg-hint{color:var(--muted);font-size:12px;margin:4px 0 8px}
  .cfg-row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-bottom:1px solid var(--line)}
  .cfg-row.on{background:#f3f7fd}
  .cfg-row label{flex:1;cursor:pointer}
  .cfg-row .typ{font-size:11px;color:var(--muted)}
  .cfg-row button{padding:1px 7px;font-size:11px}
  .cfg-sep{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 0 4px}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>🎖️ Suivi des médailles</h1>
  <div class="stats" id="stats"></div>
</header>

<div class="toolbar">
  <input id="q" type="search" placeholder="Rechercher (nom, CIS, arrêté, précisions…)">
  <span id="filters" style="display:contents"></span>
  <button id="reset" title="Effacer les filtres">✕</button>
  <button id="btnCfg" title="Choisir les filtres">⚙ Filtres</button>
  <button id="btnCols" title="Choisir les colonnes affichées">☰ Colonnes</button>
  <button class="primary" id="btnNew">+ Nouvelle demande</button>
</div>

<div class="wrap">
  <table>
    <thead><tr id="thead"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">Aucune demande ne correspond aux filtres.</div>
</div>

<div id="overlay"></div>
<aside id="drawer" aria-label="Fiche demande">
  <div class="dhead">
    <h2 id="dTitle">Fiche</h2>
    <span class="dirty" id="dirty">● modifications non enregistrées</span>
    <button id="btnClose" title="Fermer">✕</button>
  </div>
  <div class="dbody" id="form"></div>
  <div class="dfoot">
    <button class="danger" id="btnDel">Supprimer</button>
    <span class="confirm" id="confirm">Confirmer la suppression ?
      <button class="danger" id="btnDelYes">Oui, supprimer</button>
      <button id="btnDelNo">Non</button>
    </span>
    <span class="sp"></span>
    <button id="btnCancel">Annuler</button>
    <button class="primary" id="btnSave">Enregistrer</button>
  </div>
</aside>
<div id="cfg" role="dialog" aria-label="Configuration des filtres">
  <div class="dhead"><h2 id="cfgTitle">Configurer les filtres</h2><button id="cfgClose" title="Fermer">✕</button></div>
  <div class="dbody">
    <div class="cfg-hint" id="cfgHint"></div>
    <div id="cfgList"></div>
  </div>
  <div class="dfoot">
    <button id="cfgDefault">Rétablir par défaut</button>
    <span class="sp"></span>
    <button id="cfgCancel">Annuler</button>
    <button class="primary" id="cfgSave">Enregistrer</button>
  </div>
</div>
<div id="toast"></div>

<script>
/* =========================================================================
   CONFIGURATION
   Les colonnes sont retrouvées par leur libellé OU leur identifiant Grist,
   sans tenir compte des accents, majuscules, espaces ou tirets bas.
   ========================================================================= */
const SECTIONS = [
  { titre: "Agent concerné", champs: ["Grade","Nom_Prénom","Statut","CIS_SLIS","Catégorie","Groupement"] },
  { titre: "Demande", champs: ["Médaille","Echelon_demandé","Qualité_demandeur","Demandeur_Commune","Demandeur_CIS_SLIS","Demandeur_Groupement"] },
  { titre: "Instruction", champs: ["Date_Comité","Transmission_pref","Envoi DG_par_Secdir","Echelon_obtenu","Promotion","Arrêté"] },
  { titre: "Remise", champs: ["Cérémonie_remise_médaille","Année","Médaille_reçue","Diplôme_reçu","Copie RH_faite"] },
  { titre: "Suivi", champs: ["Situation","Précisions"] },
];
// Colonnes affichées dans la liste
const COLONNES_LISTE = ["Nom_Prénom","Grade","Statut","CIS_SLIS","Groupement","Médaille","Echelon_demandé","Date_Comité","Echelon_obtenu","Année","Situation"];
// Champs saisis sur toute la largeur / en zone de texte
const CHAMPS_LARGES = ["Précisions","Arrêté","Situation","Nom_Prénom"];
const CHAMPS_TEXTE_LONG = ["Précisions"];
// Champ affiché en titre de fiche
const CHAMP_TITRE = "Nom_Prénom";
// Filtres proposés par défaut (modifiables depuis le bouton ⚙ Filtres)
const FILTRES_DEFAUT = ["Médaille","Groupement","Année","Situation"];

/* ========================================================================= */
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let tableId = null;
let cols = [];          // [{id,label,type,choices,isFormula,n}]
let byKey = {};         // norm(label|id) -> col
let rows = [];          // [{id, colId: value}]
let sortCol = null, sortAsc = true;
let current = null;     // enregistrement ouvert (null = nouveau)
let dirty = false;
let selectedId = null;
let statFilter = "";
let savedFilters = null;  // colIds enregistrés dans les options du widget (null = défaut)
let savedCols = null;     // colIds des colonnes affichées dans la liste (null = défaut)
let cfgMode = "filtres";  // "filtres" ou "colonnes"
let filterVals = {};      // colId -> valeur sélectionnée
let cfgDraft = [];        // colIds en cours d'édition dans le panneau

const col = key => byKey[norm(key)];

/* ---------- Valeurs ---------- */
function toNumDate(v){
  if (v == null || v === "") return null;
  if (typeof v === "number") return v;
  if (Array.isArray(v) && (v[0]==="d"||v[0]==="D")) return v[1];
  if (v instanceof Date) return v.getTime()/1000;
  if (typeof v === "string"){
    let m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return Date.UTC(+m[1],m[2]-1,+m[3])/1000;
    m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return Date.UTC(+m[3],m[2]-1,+m[1])/1000;
  }
  return null;
}
function isYearCol(c){ return c && c.n === "annee"; }
function isDateCol(c){ return c && (c.type==="Date" || c.type.startsWith("DateTime")); }
function display(c, v){
  if (v == null || v === "") return "";
  if (c.ref === "Ref") return refLabel(c, v);
  if (c.ref === "RefList") return Array.isArray(v) ? v.slice(1).map(x => refLabel(c, x)).join(", ") : "";
  if (Array.isArray(v) && v[0]==="L") return v.slice(1).join(", ");
  if (isDateCol(c)){
    const t = toNumDate(v); if (t == null) return String(v);
    const d = new Date(t*1000);
    if (isYearCol(c)) return String(d.getUTCFullYear());
    return d.toLocaleDateString("fr-FR",{timeZone:"UTC"});
  }
  if (c.type === "Bool") return v ? "Oui" : "Non";
  return String(v);
}
function sortVal(c, v){
  if (isDateCol(c)) { const t = toNumDate(v); return t==null ? -Infinity : t; }
  if (typeof v === "number") return v;
  return norm(display(c,v));
}
function badgeClass(txt){
  const t = norm(txt);
  if (!t) return "";
  if (t.includes("cloture")) return "b-ok";
  if (t.includes("retire")||t.includes("defavorable")||t.includes("nonremis")||t.includes("refus")) return "b-ko";
  if (t.includes("attente")||t.startsWith("att")||t.includes("encours")) return "b-warn";
  return "";
}

/* ---------- Chargement ---------- */
async function loadMeta(){
  const T = await grist.docApi.fetchTable("_grist_Tables");
  const C = await grist.docApi.fetchTable("_grist_Tables_column");
  const tRef = T.id[T.tableId.indexOf(tableId)];
  const list = [];
  C.id.forEach((_, i) => {
    if (C.parentId[i] !== tRef) return;
    const id = C.colId[i];
    if (id === "manualSort" || id.startsWith("gristHelper_")) return;
    let opts = {}; try { opts = JSON.parse(C.widgetOptions[i] || "{}"); } catch(e){}
    const type = C.type[i] || "Any";
    const c = { id, label: String(C.label[i] || id).replace(/_/g," "), type,
      choices: opts.choices || null, isFormula: !!(C.isFormula[i] && C.formula[i]),
      pos: C.parentPos[i] };
    // Colonnes Référence : table liée + colonne affichée
    const m = type.match(/^(Ref|RefList):(.+)$/);
    if (m) {
      c.ref = m[1]; c.refTable = m[2];
      const k = C.id.indexOf(C.visibleCol ? C.visibleCol[i] : 0);
      c.refCol = k >= 0 ? C.colId[k] : null;
      c.refMap = new Map();
    }
    list.push(c);
  });
  list.sort((a,b)=>a.pos-b.pos);
  cols = list; byKey = {};
  cols.forEach(c => { c.n = norm(c.label); byKey[norm(c.id)] = c; byKey[c.n] = c; });
}
async function loadRows(){
  const D = await grist.docApi.fetchTable(tableId);
  rows = D.id.map((id, i) => { const r = {id}; cols.forEach(c => r[c.id] = D[c.id] ? D[c.id][i] : null); return r; });
  // Intitulés des colonnes Référence
  const cache = {};
  for (const c of cols.filter(c => c.ref)) {
    try {
      const R = cache[c.refTable] || (cache[c.refTable] = await grist.docApi.fetchTable(c.refTable));
      const vals = c.refCol && R[c.refCol] ? R[c.refCol] : R.id;
      c.refMap = new Map(R.id.map((id, i) => [id, vals[i] == null ? "" : String(vals[i])]));
    } catch(e){ console.warn("Référence illisible", c.id, e); }
  }
}
function refLabel(c, id){ return !id ? "" : (c.refMap.has(id) ? c.refMap.get(id) : "#" + id); }
function refOptions(c){
  return [...c.refMap.entries()].filter(([,l]) => l !== "")
    .sort((a,b) => a[1].localeCompare(b[1], "fr", {numeric:true}));
}
async function refresh(){
  try {
    if (!tableId) tableId = await grist.getSelectedTableId();
    if (!cols.length) await loadMeta();
    await loadRows();
    buildFilters(); render();
    if (current && !dirty) { const r = rows.find(x=>x.id===current.id); if (r) { current = r; fillForm(r); } }
  } catch(e){ console.error(e); toast("Erreur de chargement : " + e.message); }
}

/* ---------- Filtres ---------- */
function distinct(c, fn = display){
  if (!c) return [];
  const m = new Map();
  rows.forEach(r => { const d = fn(c, r[c.id]); if (d) m.set(d, (m.get(d)||0)+1); });
  return [...m.keys()].sort((a,b)=>a.localeCompare(b,"fr",{numeric:true}));
}
// Valeur utilisée pour filtrer : l'année pour les dates, la valeur affichée sinon
function fval(c, v){
  if (isDateCol(c)) { const t = toNumDate(v); return t==null ? "" : String(new Date(t*1000).getUTCFullYear()); }
  return display(c, v);
}
function filterCols(){
  const ids = savedFilters || FILTRES_DEFAUT.map(col).filter(Boolean).map(c => c.id);
  return ids.map(id => cols.find(c => c.id === id)).filter(Boolean);
}
function defaultListIds(){
  const l = COLONNES_LISTE.map(col).filter(Boolean);
  return (l.length ? l : cols.slice(0,8)).map(c => c.id);
}
function listCols(){
  return (savedCols || defaultListIds()).map(id => cols.find(c => c.id === id)).filter(Boolean);
}
function buildFilters(){
  const fc = filterCols();
  Object.keys(filterVals).forEach(k => { if (!fc.some(c=>c.id===k)) delete filterVals[k]; });
  $("filters").innerHTML = fc.map(c => {
    const vals = distinct(c, fval);
    if (filterVals[c.id] && !vals.includes(filterVals[c.id])) delete filterVals[c.id];
    const cur = filterVals[c.id] || "";
    const lab = isDateCol(c) && !isYearCol(c) ? c.label + " (année)" : c.label;
    return `<div class="flt"><small>${esc(lab)}</small><select data-f="${c.id}" class="${cur?"on":""}">` +
      `<option value="">Tous</option>` +
      vals.map(v => `<option${v===cur?" selected":""}>${esc(v)}</option>`).join("") + `</select></div>`;
  }).join("");
}
function filtered(){
  const q = norm($("q").value);
  const f = Object.entries(filterVals).filter(([,v]) => v)
    .map(([id,v]) => [cols.find(c=>c.id===id), v]).filter(([c]) => c);
  const sit = col("Situation");
  return rows.filter(r => {
    if (q && !cols.some(c => norm(display(c, r[c.id])).includes(q))) return false;
    if (!f.every(([c,v]) => fval(c, r[c.id]) === v)) return false;
    if (statFilter && sit) {
      const b = badgeClass(display(sit, r[sit.id]));
      if (statFilter === "none" ? b !== "" : b !== statFilter) return false;
    }
    return true;
  });
}

/* ---------- Rendu liste ---------- */
function render(){
  const shown = listCols();
  $("thead").innerHTML = shown.map(c =>
    `<th data-c="${c.id}">${esc(c.label)}${sortCol===c.id?`<span class="arr">${sortAsc?"▲":"▼"}</span>`:""}</th>`).join("");
  let data = filtered();
  if (sortCol){
    const c = cols.find(x=>x.id===sortCol);
    data = data.slice().sort((a,b)=>{ const x=sortVal(c,a[c.id]), y=sortVal(c,b[c.id]);
      return (x<y?-1:x>y?1:0) * (sortAsc?1:-1); });
  }
  const sit = col("Situation");
  $("tbody").innerHTML = data.map(r => `<tr data-id="${r.id}" class="${r.id===selectedId?"sel":""}">` +
    shown.map(c => {
      const d = display(c, r[c.id]);
      if (c === sit && d) return `<td title="${esc(d)}"><span class="badge ${badgeClass(d)}">${esc(d)}</span></td>`;
      return `<td title="${esc(d)}">${esc(d)}</td>`;
    }).join("") + "</tr>").join("");
  $("empty").style.display = data.length ? "none" : "";
  renderStats();
}
function renderStats(){
  const sit = col("Situation");
  const n = {all: rows.length, "b-ok":0, "b-warn":0, "b-ko":0, none:0};
  if (sit) rows.forEach(r => { const b = badgeClass(display(sit, r[sit.id])); n[b||"none"]++; });
  const items = [["","Total",n.all]];
  if (sit) items.push(["b-warn","En cours",n["b-warn"]],["b-ok","Clôturées",n["b-ok"]],["b-ko","Retirées / non remises",n["b-ko"]],["none","Autres",n.none]);
  $("stats").innerHTML = items.map(([k,l,v]) =>
    `<span class="stat ${k} ${statFilter===k?"active":""}" data-k="${k}">${l}<b>${v}</b></span>`).join("");
}

/* ---------- Formulaire ---------- */
function fieldHtml(c){
  const full = CHAMPS_LARGES.map(norm).includes(c.n) || CHAMPS_LARGES.map(norm).includes(norm(c.id));
  const cls = "f" + (full ? " full" : "");
  const lab = `<label for="in_${c.id}">${esc(c.label)}</label>`;
  if (c.isFormula) return `<div class="${cls}">${lab}<div class="ro" id="in_${c.id}" data-ro="1"></div></div>`;
  if (c.type === "Bool")
    return `<div class="f chk"><input type="checkbox" id="in_${c.id}" data-c="${c.id}"><label for="in_${c.id}">${esc(c.label)}</label></div>`;
  if (c.ref) {
    const opts = refOptions(c).map(([id,l])=>`<option value="${id}">${esc(l)}</option>`).join("");
    const sel = c.ref === "Ref"
      ? `<select id="in_${c.id}" data-c="${c.id}"><option value=""></option>${opts}</select>`
      : `<select multiple size="4" id="in_${c.id}" data-c="${c.id}">${opts}</select>`;
    const add = c.refCol ? `<button type="button" class="addref" data-add="${c.id}" title="Créer une nouvelle valeur dans ${esc(c.refTable)}">+</button>` : "";
    return `<div class="${cls}">${lab}<div class="refwrap">${sel}${add}</div>
      <div class="newref" id="nr_${c.id}">
        <input type="text" placeholder="Nouveau : ${esc(c.label)}" data-newfor="${c.id}">
        <button type="button" class="primary" data-create="${c.id}">Créer</button>
        <button type="button" data-cancelnew="${c.id}" title="Annuler">✕</button>
      </div></div>`;
  }
  if (c.type === "Choice" && c.choices)
    return `<div class="${cls}">${lab}<select id="in_${c.id}" data-c="${c.id}"><option value=""></option>${
      c.choices.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div>`;
  if (isDateCol(c) && isYearCol(c))
    return `<div class="${cls}">${lab}<input type="number" min="1950" max="2100" step="1" id="in_${c.id}" data-c="${c.id}" placeholder="AAAA"></div>`;
  if (isDateCol(c))
    return `<div class="${cls}">${lab}<input type="date" id="in_${c.id}" data-c="${c.id}"></div>`;
  if (c.type === "Numeric" || c.type === "Int")
    return `<div class="${cls}">${lab}<input type="number" step="any" id="in_${c.id}" data-c="${c.id}"></div>`;
  if (CHAMPS_TEXTE_LONG.map(norm).includes(c.n))
    return `<div class="${cls} full">${lab}<textarea id="in_${c.id}" data-c="${c.id}"></textarea></div>`;
  // Texte : suggestions à partir des valeurs déjà saisies
  return `<div class="${cls}">${lab}<input type="text" list="dl_${c.id}" id="in_${c.id}" data-c="${c.id}" autocomplete="off">` +
    `<datalist id="dl_${c.id}">${distinct(c).map(v=>`<option value="${esc(v)}">`).join("")}</datalist></div>`;
}
function buildForm(){
  const used = new Set();
  let html = SECTIONS.map(s => {
    const cs = s.champs.map(col).filter(c => c && !used.has(c.id));
    cs.forEach(c => used.add(c.id));
    if (!cs.length) return "";
    return `<fieldset><legend>${esc(s.titre)}</legend><div class="grid">${cs.map(fieldHtml).join("")}</div></fieldset>`;
  }).join("");
  const rest = cols.filter(c => !used.has(c.id));
  if (rest.length) html += `<fieldset><legend>Autres informations</legend><div class="grid">${rest.map(fieldHtml).join("")}</div></fieldset>`;
  $("form").innerHTML = html;
}
function fillForm(r){
  cols.forEach(c => {
    const el = $("in_"+c.id); if (!el) return;
    const v = r ? r[c.id] : null;
    if (el.dataset.ro) { el.textContent = display(c, v); return; }
    if (c.ref === "Ref") { el.value = v ? String(v) : ""; return; }
    if (c.ref === "RefList") {
      const ids = Array.isArray(v) ? v.slice(1).map(String) : [];
      [...el.options].forEach(o => o.selected = ids.includes(o.value)); return;
    }
    if (c.type === "Bool") el.checked = !!v;
    else if (isDateCol(c)) {
      const t = toNumDate(v);
      el.value = t==null ? "" : (isYearCol(c) ? new Date(t*1000).getUTCFullYear() : new Date(t*1000).toISOString().slice(0,10));
    }
    else el.value = v == null ? "" : (Array.isArray(v) && v[0]==="L" ? v.slice(1).join(", ") : String(v));
    if (el.tagName === "SELECT" && el.value === "" && v) {   // valeur hors liste de choix
      el.insertAdjacentHTML("beforeend", `<option>${esc(v)}</option>`); el.value = String(v);
    }
  });
  setDirty(false);
}
function readForm(){
  const out = {};
  cols.forEach(c => {
    if (c.isFormula) return;
    const el = $("in_"+c.id); if (!el) return;
    let v;
    if (c.ref === "Ref") v = el.value ? Number(el.value) : 0;
    else if (c.ref === "RefList") { const ids = [...el.selectedOptions].map(o => Number(o.value)); v = ids.length ? ["L", ...ids] : null; }
    else if (c.type === "Bool") v = el.checked;
    else if (isDateCol(c)) {
      if (!el.value) v = null;
      else if (isYearCol(c)) v = Date.UTC(+el.value,0,1)/1000;
      else v = Date.parse(el.value+"T00:00:00Z")/1000;
    }
    else if (c.type === "Numeric" || c.type === "Int") v = el.value === "" ? null : Number(el.value);
    else v = el.value.trim();
    out[c.id] = v;
  });
  return out;
}
function setDirty(b){ dirty = b; $("dirty").classList.toggle("on", b); }

function openForm(r){
  current = r;
  buildForm(); fillForm(r);
  const t = col(CHAMP_TITRE);
  $("dTitle").textContent = r ? (t && r[t.id] ? display(t, r[t.id]) : "Demande n°"+r.id) : "Nouvelle demande";
  $("btnDel").style.display = r ? "" : "none";
  $("confirm").classList.remove("on");
  $("drawer").classList.add("open"); $("overlay").classList.add("open");
  const first = $("form").querySelector("[data-c]"); if (first && !r) first.focus();
}
function closeForm(force){
  if (dirty && !force) { toast("Modifications non enregistrées : cliquez sur Annuler pour les abandonner"); return; }
  $("drawer").classList.remove("open"); $("overlay").classList.remove("open");
  current = null; setDirty(false);
}

/* ---------- Écriture ---------- */
async function save(){
  const data = readForm();
  const t = col(CHAMP_TITRE);
  if (t && !data[t.id]) { toast(`Le champ « ${t.label} » est obligatoire`); $("in_"+t.id).focus(); return; }
  $("btnSave").disabled = true;
  try {
    if (current) {
      // n'envoie que les champs modifiés
      const ch = {};
      Object.keys(data).forEach(k => {
        const a = data[k], b = current[k];
        const empty = x => x == null || x === "" || x === 0;
        const key = x => Array.isArray(x) ? JSON.stringify(x.slice(1).sort()) : JSON.stringify(x);
        const same = empty(a) && empty(b) || a === b || key(a) === key(b) ||
          (isDateCol(cols.find(c=>c.id===k)) && a === toNumDate(b));
        if (!same) ch[k] = a;
      });
      if (Object.keys(ch).length) await grist.docApi.applyUserActions([["UpdateRecord", tableId, current.id, ch]]);
      toast("Fiche enregistrée");
      setDirty(false); await refresh();
    } else {
      const res = await grist.docApi.applyUserActions([["AddRecord", tableId, null, data]]);
      const newId = res && res.retValues ? res.retValues[0] : null;
      toast("Demande créée");
      setDirty(false); await refresh();
      const r = rows.find(x=>x.id===newId);
      if (r) { selectedId = r.id; openForm(r); render(); try { grist.setCursorPos({rowId:r.id}); } catch(e){} }
    }
  } catch(e){ console.error(e); toast("Erreur d'enregistrement : " + e.message); }
  $("btnSave").disabled = false;
}
async function del(){
  if (!current) return;
  try {
    await grist.docApi.applyUserActions([["RemoveRecord", tableId, current.id]]);
    toast("Demande supprimée"); closeForm(true); selectedId = null; await refresh();
  } catch(e){ toast("Erreur de suppression : " + e.message); }
}

/* ---------- Évènements ---------- */
let toastT;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2800); }

$("q").addEventListener("input", render);
$("filters").addEventListener("change", e => {
  const s = e.target.closest("select[data-f]"); if (!s) return;
  filterVals[s.dataset.f] = s.value; s.classList.toggle("on", !!s.value); render();
});
$("reset").onclick = () => { $("q").value = ""; filterVals = {}; statFilter = ""; buildFilters(); render(); };

/* ---------- Configuration des filtres et des colonnes ---------- */
const TYPES = {Text:"texte",Choice:"choix",ChoiceList:"choix multiple",Date:"date",Numeric:"nombre",Int:"entier",Bool:"oui/non",Ref:"référence",RefList:"références",Any:"—"};
const CFG = {
  filtres:  { titre: "Configurer les filtres", sep: "Filtres affichés", vide: "Aucun filtre.",
    aide: "Cochez les colonnes à proposer comme filtres et ordonnez-les avec ↑ ↓. Les colonnes de date sont filtrées par année.",
    actuel: () => filterCols().map(c => c.id),
    defaut: () => FILTRES_DEFAUT.map(col).filter(Boolean).map(c => c.id),
    appliquer: ids => { savedFilters = ids; buildFilters(); }, option: "filtres", ok: "Filtres enregistrés" },
  colonnes: { titre: "Colonnes affichées", sep: "Colonnes visibles", vide: "Aucune colonne : la liste sera vide.",
    aide: "Cochez les colonnes à afficher dans la liste et ordonnez-les avec ↑ ↓ (de gauche à droite).",
    actuel: () => listCols().map(c => c.id),
    defaut: defaultListIds,
    appliquer: ids => { savedCols = ids; }, option: "colonnes", ok: "Colonnes enregistrées" },
};
function renderCfg(){
  const on = cfgDraft.map(id => cols.find(c=>c.id===id)).filter(Boolean);
  const off = cols.filter(c => !cfgDraft.includes(c.id));
  const row = (c, i, active) => `<div class="cfg-row ${active?"on":""}">
      <input type="checkbox" id="cf_${c.id}" data-id="${c.id}" ${active?"checked":""}>
      <label for="cf_${c.id}">${esc(c.label)} <span class="typ">${TYPES[c.type.split(":")[0]]||c.type}</span></label>
      ${active ? `<button data-up="${i}" ${i===0?"disabled":""} title="Monter">↑</button>
                  <button data-down="${i}" ${i===on.length-1?"disabled":""} title="Descendre">↓</button>` : ""}
    </div>`;
  $("cfgList").innerHTML =
    `<div class="cfg-sep">${CFG[cfgMode].sep} (${on.length})</div>` +
    (on.length ? on.map((c,i)=>row(c,i,true)).join("") : `<div class="cfg-hint">${CFG[cfgMode].vide}</div>`) +
    `<div class="cfg-sep">Autres colonnes</div>` + off.map(c=>row(c,0,false)).join("");
}
function openCfg(mode){
  if (!cols.length) return;
  cfgMode = mode === "colonnes" ? "colonnes" : "filtres";
  $("cfgTitle").textContent = CFG[cfgMode].titre;
  $("cfgHint").textContent = CFG[cfgMode].aide;
  cfgDraft = CFG[cfgMode].actuel();
  renderCfg(); $("cfg").classList.add("open"); $("overlay").classList.add("open");
}
function closeCfg(){
  $("cfg").classList.remove("open");
  if (!$("drawer").classList.contains("open")) $("overlay").classList.remove("open");
}
$("btnCfg").onclick = () => openCfg("filtres");
$("btnCols").onclick = () => openCfg("colonnes");
$("cfgList").addEventListener("change", e => {
  const id = e.target.dataset.id; if (!id) return;
  cfgDraft = e.target.checked ? [...cfgDraft, id] : cfgDraft.filter(x => x !== id);
  renderCfg();
});
$("cfgList").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const i = +(b.dataset.up ?? b.dataset.down), j = b.dataset.up != null ? i-1 : i+1;
  [cfgDraft[i], cfgDraft[j]] = [cfgDraft[j], cfgDraft[i]]; renderCfg();
});
$("cfgDefault").onclick = () => { cfgDraft = CFG[cfgMode].defaut(); renderCfg(); };
$("cfgCancel").onclick = closeCfg;
$("cfgClose").onclick = closeCfg;
$("cfgSave").onclick = async () => {
  const m = CFG[cfgMode], ids = cfgDraft.slice();
  m.appliquer(ids); render(); closeCfg();
  try { await grist.setOption(m.option, ids); toast(m.ok + " dans le document"); }
  catch(e){ console.error(e); toast("Appliqué, mais non enregistré (droits insuffisants ?)"); }
};
$("stats").onclick = e => { const s = e.target.closest(".stat"); if (!s) return; statFilter = s.dataset.k === statFilter ? "" : s.dataset.k; render(); };
$("thead").onclick = e => { const th = e.target.closest("th"); if (!th) return;
  if (sortCol === th.dataset.c) sortAsc = !sortAsc; else { sortCol = th.dataset.c; sortAsc = true; } render(); };
$("tbody").onclick = e => { const tr = e.target.closest("tr"); if (!tr) return;
  const r = rows.find(x => x.id === +tr.dataset.id); if (!r) return;
  if (dirty) { toast("Enregistrez ou annulez la fiche en cours"); return; }
  selectedId = r.id; render(); openForm(r);
  try { grist.setCursorPos({rowId: r.id}); } catch(err){} };
$("btnNew").onclick = () => { if (dirty) { toast("Enregistrez ou annulez la fiche en cours"); return; } selectedId=null; render(); openForm(null); };
$("form").addEventListener("input", e => { if (!e.target.dataset.newfor) setDirty(true); });
$("form").addEventListener("change", e => { if (!e.target.dataset.newfor) setDirty(true); });

/* ---------- Création d'une valeur dans une table liée ---------- */
function toggleNew(id, on){
  const box = $("nr_"+id); if (!box) return;
  box.classList.toggle("on", on);
  const inp = box.querySelector("input"); inp.value = "";
  if (on) inp.focus();
}
async function createRef(id){
  const c = cols.find(x => x.id === id); if (!c) return;
  const inp = $("nr_"+id).querySelector("input");
  const val = inp.value.trim();
  if (!val) { inp.focus(); return; }
  // Valeur déjà existante (sans tenir compte des accents/majuscules) : on la sélectionne
  let newId = [...c.refMap.entries()].find(([,l]) => norm(l) === norm(val))?.[0];
  const btn = $("nr_"+id).querySelector("[data-create]"); btn.disabled = true;
  try {
    setDirty(true);
    if (newId) toast("Cette valeur existe déjà : elle a été sélectionnée");
    else {
      const res = await grist.docApi.applyUserActions([["AddRecord", c.refTable, null, {[c.refCol]: val}]]);
      newId = res && res.retValues ? res.retValues[0] : null;
      if (!newId) throw new Error("identifiant non renvoyé");
      // mise à jour de toutes les colonnes pointant vers la même table
      cols.filter(x => x.ref && x.refTable === c.refTable && x.refCol === c.refCol).forEach(x => {
        x.refMap.set(newId, val);
        const s = $("in_"+x.id);
        if (s) s.insertAdjacentHTML("beforeend", `<option value="${newId}">${esc(val)}</option>`);
      });
      toast(`« ${val} » ajouté à ${c.refTable}`);
    }
    const s = $("in_"+id);
    if (c.ref === "Ref") s.value = String(newId);
    else [...s.options].forEach(o => { if (o.value === String(newId)) o.selected = true; });
    toggleNew(id, false);
  } catch(e){ console.error(e); toast("Création impossible : " + e.message); }
  btn.disabled = false;
}
$("form").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.add) toggleNew(b.dataset.add, !$("nr_"+b.dataset.add).classList.contains("on"));
  else if (b.dataset.cancelnew) toggleNew(b.dataset.cancelnew, false);
  else if (b.dataset.create) createRef(b.dataset.create);
});
$("form").addEventListener("keydown", e => {
  const id = e.target.dataset.newfor; if (!id) return;
  if (e.key === "Enter") { e.preventDefault(); createRef(id); }
  if (e.key === "Escape") { e.stopPropagation(); toggleNew(id, false); }
});
$("btnSave").onclick = save;
$("btnCancel").onclick = () => closeForm(true);
$("btnClose").onclick = () => closeForm(false);
$("overlay").onclick = () => { if ($("cfg").classList.contains("open")) closeCfg(); else closeForm(false); };
$("btnDel").onclick = () => $("confirm").classList.add("on");
$("btnDelNo").onclick = () => $("confirm").classList.remove("on");
$("btnDelYes").onclick = del;
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("cfg").classList.contains("open")) { closeCfg(); return; }
  if (e.key === "Escape" && $("drawer").classList.contains("open")) closeForm(false);
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === "s" && $("drawer").classList.contains("open")) { e.preventDefault(); save(); }
});

/* ---------- Grist ---------- */
grist.ready({ requiredAccess: "full", allowSelectBy: true, onEditOptions: () => openCfg("colonnes") });
grist.onOptions(opts => {
  savedFilters = opts && Array.isArray(opts.filtres) ? opts.filtres : null;
  savedCols = opts && Array.isArray(opts.colonnes) ? opts.colonnes : null;
  if (cols.length) { buildFilters(); render(); }
});
grist.onRecords(() => { if (!dirty) refresh(); });
grist.onRecord(r => { if (r && r.id && !$("drawer").classList.contains("open")) { selectedId = r.id; render(); } });
</script>
</body>
</html>
